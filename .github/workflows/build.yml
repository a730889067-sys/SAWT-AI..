name: Build SAWT AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: إعداد Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: فك ضغط المشروع
        run: |
          unzip -o SAWT_AI_Android_Project.zip -d extracted
          find extracted -name settings.gradle -type f

      - name: بناء التطبيق
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle -type f | head -n 1)")
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug

      - name: حفظ ملف التطبيق
        uses: actions/upload-artifact@v4
        with:
          name: SAWT-AI-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
